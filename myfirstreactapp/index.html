<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#CFCBC0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the OS preference) before first paint.
      (function () {
        var theme;
        try { theme = localStorage.getItem('portfolio-theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#302F2B';
      })();
    </script>
    <title>Ashley Towey — Selected work</title>
    <meta name="description" content="Selected portfolio projects by Ashley Towey across design, computing and creativity." />
    <!--app-head-->
    <link rel="preload" href="/fonts/neue-regrade-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
